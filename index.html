let lang = 'ur';
let currentPhase = 0;
let currentCat = 0;

function setLang(l, btn) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('headerSub').textContent = DATA[lang].headerSub;
  document.getElementById('catLabel').textContent = DATA[lang].catLabel;
  currentPhase = 0;
  currentCat = 0;
  renderCats();
  renderTabs();
  renderContent();
}

function setCat(i, btn) {
  currentCat = i;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderContent();
}

function renderCats() {
  const d = DATA[lang];
  const wrap = document.getElementById('catBtns');
  wrap.innerHTML = d.cats.map((c,i) =>
    `<button class="cat-btn${i===currentCat?' active':''}" onclick="setCat(${i},this)">${d.catIcons[i]} ${c}</button>`
  ).join('');
}

function renderTabs() {
  const d = DATA[lang];
  document.getElementById('phaseTabs').innerHTML = d.phases.map((p,i) =>
    `<button class="tab-btn${i===currentPhase?' active':''}" onclick="goPhase(${i})">${p.icon} ${p.tag}</button>`
  ).join('');
}

function renderContent() {
  const d = DATA[lang];
  const p = d.phases[currentPhase];
  document.getElementById('catBar').style.display = currentPhase === 0 ? '' : 'none';

  let html = `
    <div class="phase-header" style="border-left:4px solid ${p.tagColor}">
      <div class="phase-tag" style="background:${p.tagBg};color:${p.tagColor}">${p.tag} — ${p.label}</div>
      <div class="phase-timing">${p.timing}</div>
      <div class="phase-intro">${p.intro}</div>
    </div>`;

  p.blocks.forEach((block, bi) => {
    const lines = block.catBased ? [block.lines[currentCat]] : block.lines;
    html += `<div style="margin-bottom:12px">
      <div class="block-label" style="color:${block.speakerColor}">${block.speaker}</div>`;
    lines.forEach((line, li) => {
      const id = `c_${bi}_${li}`;
      const safe = line.text.replace(/\\/g,'\\\\').replace(/`/g,'\\`').replace(/"/g,'&quot;');
      html += `
        <div class="script-card" style="background:${block.bg};border-color:${block.border}">
          ${line.cat ? `<div class="line-cat" style="color:${block.border}">${line.cat}</div>` : ''}
          <div class="line-text">${line.text}</div>
          <button class="copy-btn" id="${id}" onclick="copyText('${id}',\`${safe}\`)">COPY</button>
        </div>`;
    });
    html += `</div>`;
  });

  html += `
    <div class="tip-box">
      <div class="tip-icon">&#128161;</div>
      <div class="tip-text"><strong>PRO TIP: </strong>${p.tip}</div>
    </div>
    <div class="nav-btns">
      <button class="nav-btn" onclick="goPhase(${currentPhase-1})" ${currentPhase===0?'disabled':''}>&#8592; Previous</button>
      <button class="nav-btn next" onclick="goPhase(${currentPhase+1})" ${currentPhase===d.phases.length-1?'disabled':''}>Next Phase &#8594;</button>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-track"><div class="progress-fill" style="width:${((currentPhase+1)/d.phases.length)*100}%"></div></div>
      <div class="progress-label">Phase ${currentPhase+1} of ${d.phases.length}</div>
    </div>`;

  document.getElementById('mainContent').innerHTML = html;
}

function goPhase(i) {
  const d = DATA[lang];
  if(i < 0 || i >= d.phases.length) return;
  currentPhase = i;
  renderTabs();
  renderContent();
  window.scrollTo({top:0,behavior:'smooth'});
}

function copyText(id, text) {
  const clean = text.replace(/&quot;/g,'"');
  navigator.clipboard.writeText(clean).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = clean; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
  });
  const btn = document.getElementById(id);
  if(btn){ btn.textContent='✓'; btn.classList.add('copied'); setTimeout(()=>{btn.textContent='COPY';btn.classList.remove('copied');},1800); }
}

function downloadPage() {
  const blob = new Blob([document.documentElement.outerHTML],{type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'MA_Academy_Mystery_Caller_Script.html';
  a.click();
}

renderCats();
renderTabs();
renderContent();
</script>
</body>
</html>
